# Pull and restart api + worker in Coolify.
# Starts after Push Images has pointed :main and :latest at the commit tag.
# Rerun this workflow alone when the webhook or health check fails.
# Image builds stay in Build Images; tag promotion stays in Push Images.
#
# 1. applies migrations with the owner URL (OWNER_DATABASE_URL)
# 2. calls Coolify deploy webhooks so Coolify pulls :latest
#    (COOLIFY_WEBHOOK_API, COOLIFY_WEBHOOK_WORKER, Authorization: Bearer COOLIFY_TOKEN)
# 3. waits for the expected commit in healthz and healthy readyz; old API 200s do not count

name: Deploy

on:
  workflow_run:
    workflows: ['Push Images']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      promotion_run_id:
        description: 'Successful Push Images run ID for current main'
        required: true
        type: string
      trigger_coolify:
        description: 'Call Coolify deploy webhooks after migrations'
        type: boolean
        default: true

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  gate:
    name: Confirm image promotion
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.marker.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Download required promotion marker
        uses: actions/download-artifact@v4
        with:
          name: image-release
          path: release
          run-id: ${{ github.event.workflow_run.id || inputs.promotion_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate promoted release
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.promotion_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected a Push Images run ID.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export CURRENT_MAIN_SHA
          python3 infra/ci/release.py deploy

      - name: Log in to GHCR for release verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Verify promoted images before allowing migrations
        run: python3 infra/ci/release.py verify-images --tags main latest

      - name: Explain migration-only recovery
        if: github.event_name == 'workflow_dispatch' && !inputs.trigger_coolify
        run: echo 'Migration-only recovery selected. Restart and API verification are intentionally disabled.' >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Apply database migrations
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout promoted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install database package
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile --filter @openconferences/db...

      - name: Reject superseded release before migrations
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export CURRENT_MAIN_SHA
          python3 infra/ci/release.py assert-current

      - name: Migrate with the owner role
        env:
          DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
        run: |
          set -eu
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "OWNER_DATABASE_URL is not set."
            echo "Add the owner/postgres session-pooler URL as a repository Actions secret."
            echo "Do not use the openconferences_api or openconferences_worker role."
            exit 1
          fi
          pnpm db:migrate:deploy

  trigger-coolify:
    name: Coolify pull and restart
    needs: [gate, migrate]
    if: >
      needs.migrate.result == 'success' &&
      (
        github.event_name == 'workflow_run' ||
        (github.event_name == 'workflow_dispatch' && inputs.trigger_coolify)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Reject superseded release before restart
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export CURRENT_MAIN_SHA
          python3 infra/ci/release.py assert-current

      - name: Redeploy API then worker
        env:
          API_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_API }}
          WORKER_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WORKER }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          missing=0
          if [ -z "$API_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_API is not set."
            missing=1
          fi
          if [ -z "$WORKER_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_WORKER is not set."
            missing=1
          fi
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_TOKEN is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "In Coolify, open each Docker Image resource → Webhooks → copy Deploy Webhook (auth required)."
            echo "Keys & Tokens → API tokens → create a token with the deploy permission."
            echo "Then: gh secret set COOLIFY_WEBHOOK_API && gh secret set COOLIFY_WEBHOOK_WORKER && gh secret set COOLIFY_TOKEN"
            exit 1
          fi
          trigger() {
            name="$1"
            url="$2"
            code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/coolify-body -w '%{http_code}' -X POST "$url" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Accept: application/json")"
            echo "${name} webhook HTTP ${code}"
            cat /tmp/coolify-body
            echo
            case "$code" in
              200|201|202|204) ;;
              *) exit 1 ;;
            esac
          }
          trigger API "$API_WEBHOOK"
          # Stagger so a 2 GiB host is not pulling both images at once.
          sleep 15
          trigger Worker "$WORKER_WEBHOOK"

  verify-api:
    name: Verify API health
    needs: [gate, trigger-coolify]
    if: needs.trigger-coolify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for expected API revision and readiness
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -eu
          health="https://api.fresi.org/api/v1/healthz"
          ready="https://api.fresi.org/api/v1/readyz"
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 10 "$health" >/tmp/healthz.json \
              && jq -e --arg sha "$EXPECTED_SHA" '.status == "ok" and .revision == $sha' /tmp/healthz.json >/dev/null \
              && curl -fsS --max-time 10 "$ready" >/tmp/readyz.json \
              && jq -e '.status == "ok"' /tmp/readyz.json >/dev/null; then
              echo "API healthy (attempt ${attempt}):"
              cat /tmp/healthz.json
              echo
              cat /tmp/readyz.json
              echo
              echo "Verified deployed API revision: ${EXPECTED_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt ${attempt}/40: expected API revision is not ready yet"
            sleep 15
          done
          echo "API did not reach the expected revision and readiness within 40 checks."
          exit 1
