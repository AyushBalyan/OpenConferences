# Build api + worker on GitHub-hosted runners and push to GHCR.
# Coolify on the small EC2 box only pulls prebuilt images (no remote Docker build).
#
# This workflow does not start on push. It starts after the CI workflow
# finishes, and it publishes images only when that run succeeded on main
# for the same commit and the commit touches the image inputs below.
#
# Images:
#   ghcr.io/<owner>/<repo>/api:<sha>|main|latest
#   ghcr.io/<owner>/<repo>/worker:<sha>|main|latest
#
# After a successful image push the workflow:
#   1. applies migrations with the owner URL (OWNER_DATABASE_URL)
#   2. calls Coolify deploy webhooks (COOLIFY_WEBHOOK_API, COOLIFY_WEBHOOK_WORKER)
#      with Authorization: Bearer COOLIFY_TOKEN (deploy permission)
#   3. waits until https://api.fresi.org/api/v1/healthz and readyz return 200

name: Build and Push Images

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      trigger_coolify:
        description: 'Call Coolify deploy webhooks after a successful push'
        type: boolean
        default: true

concurrency:
  group: ghcr-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  skip-on-red-ci:
    name: Skip image publish
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped publish
        run: |
          echo "CI for ${{ github.event.workflow_run.head_sha }} concluded ${{ github.event.workflow_run.conclusion }}."
          echo "Image publish skipped."

  changes:
    name: Confirm CI and image paths
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
      sha: ${{ steps.filter.outputs.sha }}
      branch: ${{ steps.filter.outputs.branch }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect deploy paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -eu
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: build images."
            exit 0
          fi

          if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
            files="$(git diff --name-only "${HEAD_SHA}^" "$HEAD_SHA")"
          else
            files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          fi
          echo "Changed files:"
          printf '%s\n' "$files"

          deploy=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              apps/api/*|apps/worker/*|packages/*|infra/docker/*|pnpm-lock.yaml|package.json|pnpm-workspace.yaml|.dockerignore|.github/workflows/deploy.yml)
                deploy=true
                ;;
            esac
          done <<EOF
          $files
          EOF

          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          if [ "$deploy" = "true" ]; then
            echo "Image inputs changed. Building ${HEAD_SHA}."
          else
            echo "No api, worker, package, or Docker inputs changed. Skipping image publish."
          fi

  build-and-push:
    name: Build (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set image name (lowercase for GHCR)
        id: meta
        run: |
          OWNER_REPO="${{ github.repository }}"
          OWNER_REPO_LC="$(echo "$OWNER_REPO" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_REPO_LC}/${{ matrix.image }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ needs.changes.outputs.sha }}
            type=raw,value=main,enable=${{ needs.changes.outputs.branch == 'main' }}
            type=raw,value=latest,enable=${{ needs.changes.outputs.branch == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64

  migrate:
    name: Apply database migrations
    needs: [changes, build-and-push]
    if: needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install database package
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile --filter @openconferences/db...

      - name: Migrate with the owner role
        env:
          DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
        run: |
          set -eu
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "OWNER_DATABASE_URL is not set."
            echo "Add the owner/postgres session-pooler URL as a repository Actions secret."
            echo "Do not use the openconferences_api or openconferences_worker role."
            exit 1
          fi
          pnpm db:migrate:deploy

  trigger-coolify:
    name: Trigger Coolify redeploy
    needs: migrate
    if: >
      needs.migrate.result == 'success' &&
      (
        github.event_name == 'workflow_run' ||
        (github.event_name == 'workflow_dispatch' && inputs.trigger_coolify)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy API then worker
        env:
          API_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_API }}
          WORKER_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WORKER }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          missing=0
          if [ -z "$API_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_API is not set."
            missing=1
          fi
          if [ -z "$WORKER_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_WORKER is not set."
            missing=1
          fi
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_TOKEN is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "In Coolify, open each Docker Image resource → Webhooks → copy Deploy Webhook (auth required)."
            echo "Keys & Tokens → API tokens → create a token with the deploy permission."
            echo "Then: gh secret set COOLIFY_WEBHOOK_API && gh secret set COOLIFY_WEBHOOK_WORKER && gh secret set COOLIFY_TOKEN"
            exit 1
          fi
          curl -fsS -X GET "$API_WEBHOOK" -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo "API webhook triggered."
          # Stagger so a 2 GiB host is not pulling both images at once.
          sleep 15
          curl -fsS -X GET "$WORKER_WEBHOOK" -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo "Worker webhook triggered."

  verify-api:
    name: Verify API health
    needs: trigger-coolify
    if: needs.trigger-coolify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for healthz and readyz
        run: |
          set -eu
          health="https://api.fresi.org/api/v1/healthz"
          ready="https://api.fresi.org/api/v1/readyz"
          for attempt in $(seq 1 40); do
            if curl -fsS "$health" >/tmp/healthz.json && curl -fsS "$ready" >/tmp/readyz.json; then
              echo "API healthy (attempt ${attempt}):"
              cat /tmp/healthz.json
              echo
              cat /tmp/readyz.json
              echo
              exit 0
            fi
            echo "Attempt ${attempt}/40: API not ready yet"
            sleep 15
          done
          echo "API did not become healthy within 10 minutes."
          exit 1
