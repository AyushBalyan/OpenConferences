# Pull and restart api + worker in Coolify.
# Starts after Push Images has pointed :main and :latest at the commit tag.
# Rerun this workflow alone when the webhook or health check fails.
# Image builds stay in Build Images; tag promotion stays in Push Images.
#
# 1. applies migrations with the owner URL (OWNER_DATABASE_URL)
# 2. calls Coolify deploy webhooks so Coolify pulls :latest
#    (COOLIFY_WEBHOOK_API, COOLIFY_WEBHOOK_WORKER, Authorization: Bearer COOLIFY_TOKEN)
# 3. waits until https://api.fresi.org/api/v1/healthz and readyz return 200

name: Deploy

on:
  workflow_run:
    workflows: ['Push Images']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      trigger_coolify:
        description: 'Call Coolify deploy webhooks after migrations'
        type: boolean
        default: true

concurrency:
  group: coolify-deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Confirm image promotion
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      release: ${{ steps.marker.outputs.release }}
      sha: ${{ steps.marker.outputs.sha }}
    steps:
      - name: Download promotion marker
        id: download
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: image-release
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve commit to deploy
        id: marker
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "Manual deploy of ${HEAD_SHA}."
            exit 0
          fi
          if [ ! -f release/image-release.json ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Push Images did not promote a tag. Skipping Coolify."
            exit 0
          fi
          sha="$(jq -r '.sha' release/image-release.json)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Release marker SHA is invalid."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${sha}."

  migrate:
    name: Apply database migrations
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout promoted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install database package
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile --filter @openconferences/db...

      - name: Migrate with the owner role
        env:
          DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
        run: |
          set -eu
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "OWNER_DATABASE_URL is not set."
            echo "Add the owner/postgres session-pooler URL as a repository Actions secret."
            echo "Do not use the openconferences_api or openconferences_worker role."
            exit 1
          fi
          pnpm db:migrate:deploy

  trigger-coolify:
    name: Coolify pull and restart
    needs: [gate, migrate]
    if: >
      needs.migrate.result == 'success' &&
      (
        github.event_name == 'workflow_run' ||
        (github.event_name == 'workflow_dispatch' && inputs.trigger_coolify)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy API then worker
        env:
          API_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_API }}
          WORKER_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WORKER }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          missing=0
          if [ -z "$API_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_API is not set."
            missing=1
          fi
          if [ -z "$WORKER_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_WORKER is not set."
            missing=1
          fi
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_TOKEN is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "In Coolify, open each Docker Image resource → Webhooks → copy Deploy Webhook (auth required)."
            echo "Keys & Tokens → API tokens → create a token with the deploy permission."
            echo "Then: gh secret set COOLIFY_WEBHOOK_API && gh secret set COOLIFY_WEBHOOK_WORKER && gh secret set COOLIFY_TOKEN"
            exit 1
          fi
          trigger() {
            name="$1"
            url="$2"
            code="$(curl -sS -o /tmp/coolify-body -w '%{http_code}' -X POST "$url" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Accept: application/json")"
            echo "${name} webhook HTTP ${code}"
            cat /tmp/coolify-body
            echo
            case "$code" in
              200|201|202|204) ;;
              *) exit 1 ;;
            esac
          }
          trigger API "$API_WEBHOOK"
          # Stagger so a 2 GiB host is not pulling both images at once.
          sleep 15
          trigger Worker "$WORKER_WEBHOOK"

  verify-api:
    name: Verify API health
    needs: trigger-coolify
    if: needs.trigger-coolify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for healthz and readyz
        run: |
          set -eu
          health="https://api.fresi.org/api/v1/healthz"
          ready="https://api.fresi.org/api/v1/readyz"
          for attempt in $(seq 1 40); do
            if curl -fsS "$health" >/tmp/healthz.json && curl -fsS "$ready" >/tmp/readyz.json; then
              echo "API healthy (attempt ${attempt}):"
              cat /tmp/healthz.json
              echo
              cat /tmp/readyz.json
              echo
              exit 0
            fi
            echo "Attempt ${attempt}/40: API not ready yet"
            sleep 15
          done
          echo "API did not become healthy within 10 minutes."
          exit 1
