# Build api + worker on GitHub-hosted runners.
# Coolify on the small EC2 box only pulls prebuilt images (no remote Docker build).
#
# Every successful main push CI builds both images, including test/doc-only
# fixes after an earlier failed release. Docker caching reuses unchanged layers.
# The runner cannot hand a local image to a later
# workflow, so the build publishes one immutable tag:
#   ghcr.io/<owner>/<repo>/api:<sha>
#   ghcr.io/<owner>/<repo>/worker:<sha>
# Moving tags (main, latest) are added by Push Images. Coolify is Deploy.

name: Build Images

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-build-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  reject-red-ci:
    name: CI did not pass
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Stop the chain
        run: |
          echo "CI for ${{ github.event.workflow_run.head_sha }} concluded ${{ github.event.workflow_run.conclusion }}."
          echo "Image build did not start."
          exit 1

  gate:
    name: Confirm tested main commit
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      branch: ${{ steps.candidate.outputs.branch }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Select release commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$HEAD_SHA" -f branch=main -f per_page=100 > ci-runs.json
          fi
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export CURRENT_MAIN_SHA
          python3 infra/ci/release.py select-build

  build:
    name: Build (${{ matrix.image }})
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set image name (lowercase for GHCR)
        id: meta
        run: |
          OWNER_REPO="${{ github.repository }}"
          OWNER_REPO_LC="$(echo "$OWNER_REPO" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_REPO_LC}/${{ matrix.image }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${{ needs.gate.outputs.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the commit tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            RELEASE_SHA=${{ needs.gate.outputs.sha }}
          tags: ${{ steps.meta.outputs.image }}:${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64

      - name: Record image digest
        env:
          IMAGE: ${{ matrix.image }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p image-digests
          jq -n --arg image "$IMAGE" --arg sha "$HEAD_SHA" --arg digest "$IMAGE_DIGEST" \
            '{image: $image, sha: $sha, digest: $digest}' > "image-digests/$IMAGE.json"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image }}
          path: image-digests/${{ matrix.image }}.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  record:
    name: Record release candidate
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Download both image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Write release marker
        env:
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
        run: python3 infra/ci/release.py write-build

      - name: Upload release marker
        uses: actions/upload-artifact@v4
        with:
          name: image-release
          path: release/image-release.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error
