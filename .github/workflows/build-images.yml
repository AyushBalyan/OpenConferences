# Build api + worker on GitHub-hosted runners.
# Coolify on the small EC2 box only pulls prebuilt images (no remote Docker build).
#
# This workflow starts after CI succeeds on main for a push whose files
# affect the images. The runner cannot hand a local image to a later
# workflow, so the build publishes one immutable tag:
#   ghcr.io/<owner>/<repo>/api:<sha>
#   ghcr.io/<owner>/<repo>/worker:<sha>
# Moving tags (main, latest) are added by Push Images. Coolify is Deploy.

name: Build Images

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-build-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  reject-red-ci:
    name: CI did not pass
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Stop the chain
        run: |
          echo "CI for ${{ github.event.workflow_run.head_sha }} concluded ${{ github.event.workflow_run.conclusion }}."
          echo "Image build did not start."
          exit 1

  gate:
    name: Confirm CI and image paths
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
      sha: ${{ steps.filter.outputs.sha }}
      branch: ${{ steps.filter.outputs.branch }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect image inputs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -eu
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: build images for ${HEAD_SHA}."
            exit 0
          fi

          if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
            files="$(git diff --name-only "${HEAD_SHA}^" "$HEAD_SHA")"
          else
            files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          fi
          echo "Changed files:"
          printf '%s\n' "$files"

          release=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              apps/api/*|apps/worker/*|packages/*|infra/docker/*|pnpm-lock.yaml|package.json|pnpm-workspace.yaml|.dockerignore|.github/workflows/build-images.yml)
                release=true
                ;;
            esac
          done <<EOF
          $files
          EOF

          echo "release=${release}" >> "$GITHUB_OUTPUT"
          if [ "$release" = "true" ]; then
            echo "Image inputs changed. Building ${HEAD_SHA}."
          else
            echo "No api, worker, package, or Docker inputs changed. Skipping image build."
          fi

  build:
    name: Build (${{ matrix.image }})
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set image name (lowercase for GHCR)
        id: meta
        run: |
          OWNER_REPO="${{ github.repository }}"
          OWNER_REPO_LC="$(echo "$OWNER_REPO" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_REPO_LC}/${{ matrix.image }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${{ needs.gate.outputs.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the commit tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64

  record:
    name: Record commit tags
    needs: [gate, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Write release marker
        env:
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          HEAD_BRANCH: ${{ needs.gate.outputs.branch }}
        run: |
          set -eu
          mkdir -p release
          printf '%s\n' "{\"sha\":\"${HEAD_SHA}\",\"branch\":\"${HEAD_BRANCH}\"}" > release/image-release.json
          cat release/image-release.json

      - name: Upload release marker
        uses: actions/upload-artifact@v4
        with:
          name: image-release
          path: release/image-release.json
          retention-days: 5
          if-no-files-found: error
