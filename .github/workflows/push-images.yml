# Promote images that Build Images already published.
# Does not rebuild. Copies the immutable :<sha> manifest to :main and :latest,
# which is what Coolify pulls. Deploy starts only after this workflow succeeds.

name: Push Images

on:
  workflow_run:
    workflows: ['Build Images']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA already published as an image tag'
        required: true
        type: string

concurrency:
  group: image-push-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    name: Tag main and latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Download build marker
        id: download
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: image-release
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve commit to promote
        id: marker
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$INPUT_SHA"
            branch="main"
          elif [ -f release/image-release.json ]; then
            sha="$(jq -r '.sha' release/image-release.json)"
            branch="$(jq -r '.branch' release/image-release.json)"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Build Images did not publish a commit tag. Skipping promotion."
            exit 0
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refusing to promote. Expected a full 40-character SHA, got: ${sha}"
            exit 1
          fi
          if [ "$branch" != "main" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Branch ${branch} does not update main or latest."
            exit 0
          fi
          mkdir -p release
          printf '%s\n' "{\"sha\":\"${sha}\",\"branch\":\"${branch}\"}" > release/image-release.json
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Promoting ${sha} to main and latest."

      - name: Log in to GHCR
        if: steps.marker.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.marker.outputs.release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Point main and latest at the commit tag
        if: steps.marker.outputs.release == 'true'
        env:
          HEAD_SHA: ${{ steps.marker.outputs.sha }}
        run: |
          set -eu
          owner_repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          for image in api worker; do
            source="${REGISTRY}/${owner_repo}/${image}:${HEAD_SHA}"
            echo "Promoting ${source}"
            docker buildx imagetools inspect "$source" >/dev/null
            docker buildx imagetools create \
              --tag "${REGISTRY}/${owner_repo}/${image}:main" \
              --tag "${REGISTRY}/${owner_repo}/${image}:latest" \
              "$source"
          done

      - name: Upload release marker
        if: steps.marker.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-release
          path: release/image-release.json
          retention-days: 5
          if-no-files-found: error
