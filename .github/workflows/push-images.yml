# Promote only a complete, validated build from current main.
# Shares a lock with Deploy so tags cannot move during a deployment.
name: Push Images

on:
  workflow_run:
    workflows: ['Build Images']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Build Images run ID for current main'
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  promote:
    name: Validate and promote both images
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Download required build marker
        uses: actions/download-artifact@v4
        with:
          name: image-release
          path: release
          run-id: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release candidate
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected a Build Images run ID.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export CURRENT_MAIN_SHA
          python3 infra/ci/release.py promote

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify both immutable images before changing any tag
        run: python3 infra/ci/release.py verify-images

      - name: Point main and latest at recorded image digests
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.marker.outputs.sha }}
          API_DIGEST: ${{ steps.marker.outputs.api_digest }}
          WORKER_DIGEST: ${{ steps.marker.outputs.worker_digest }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export CURRENT_MAIN_SHA
          python3 infra/ci/release.py assert-current
          owner_repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          for image in api worker; do
            if [ "$image" = api ]; then digest="$API_DIGEST"; else digest="$WORKER_DIGEST"; fi
            base="ghcr.io/$owner_repo/$image"
            docker buildx imagetools create --prefer-index=false \
              --tag "$base:main" --tag "$base:latest" "$base@$digest"
          done
          python3 infra/ci/release.py verify-images --tags main latest

      - name: Upload promotion marker only after both tags verify
        uses: actions/upload-artifact@v4
        with:
          name: image-release
          path: release/image-release.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error
